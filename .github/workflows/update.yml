name: Update results

on:
  schedule:
    # Hourly, at :17 (off the top of the hour, when GitHub's queue is busiest).
    # Draws land at 11:00 / 15:00 / 21:00 Honduras (UTC-6), but the sources post
    # them late and unpredictably: on 2026-09-17 the 16 Sep noche draw was
    # still missing at 02:54 local, and the old three-a-day schedule left it
    # unpublished until a manual run at 11:54. Checking every hour bounds that
    # gap. A run with nothing new commits nothing, and every run catches up
    # from whatever is already stored, so late or skipped runs are harmless.
    # Side effect: a disputed slot now turns every hourly run red until a
    # human resolves it (see "Flag disputed slots" below).
    - cron: '17 * * * *'
  workflow_dispatch:

# Never let two runs write results.json at once.
concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write
  # To request a Pages build explicitly — see "Request a Pages build" below.
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch new draws
        id: fetch
        run: |
          set +e
          python update.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Fail on a hard error
        if: steps.fetch.outputs.rc != '0' && steps.fetch.outputs.rc != '3'
        run: |
          echo "update.py exited ${{ steps.fetch.outputs.rc }} — results.json untouched."
          exit 1

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- results.json; then
            echo "No change to results.json."
            exit 0
          fi
          git add results.json
          SPAN=$(python -c "import json;d=json.load(open('results.json'));print(d['to'], d['days'], d['draws'])")
          set -- $SPAN
          # Identity is scoped to this one commit with -c, never written to a
          # config file, so nothing here can touch a real git identity.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Results through $1 ($2 days, $3 draws)"

          # On 2026-09-16 GitHub answered a push with "fatal error in
          # commit_refs" / "[remote rejected]" while STILL applying the ref.
          # The run went red, and because the push event never fired, Pages
          # never rebuilt: that day's 11:00 draw sat unpublished ~3.5 hours
          # until the next scheduled run. So: retry, count "our commit is
          # already on the remote" as success, and request the Pages build
          # explicitly in the next step rather than trusting the push event.
          for i in 1 2 3 4; do
            if git push; then break; fi
            git fetch -q origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Push reported failure, but the commit is on the remote."
              break
            fi
            if [ "$i" = 4 ]; then
              echo "Push failed after $i attempts."
              exit 1
            fi
            echo "Push failed (attempt $i); retrying."
            sleep $((i * 15))
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                pull -q --rebase origin main
          done
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # A duplicate of the build the push event normally triggers is harmless;
      # a missing one leaves the feed stale for hours. Never fail the run on it.
      - name: Request a Pages build
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Pages build request failed; the push event may still publish."

      # Deliberately last: a disputed slot still publishes everything else, but
      # the run goes red so a human comes and resolves it. See update.py.
      - name: Flag disputed slots
        if: steps.fetch.outputs.rc == '3'
        run: |
          echo "::error::The two sources disagreed on at least one slot."
          echo "The disputed slot was left empty rather than guessed."
          echo "Check the 'Fetch new draws' log, decide which source is right,"
          echo "then run: python update.py --start <the date>"
          exit 1
